name: pre-pr

on:
  push:
    branches:
      - "codex/**"
      - "fix/**"
      - "feat/**"
  pull_request:

concurrency:
  group: pre-pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-pr:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, typecheck, test, build
        run: npm run pre-pr
